# Home Lab SOC — search macros
# Install:  cp macros.conf $SPLUNK_HOME/etc/apps/search/local/  (merge if it exists), then restart or reload:
#           splunk _internal call /services/admin/conf-macros/_reload -auth <user>:<pass>

# soc_detections — one row per detection hit across all 8 techniques.
# Fields: _time, sig ("Name [Txxxx]"), detection, mitre, tactic, actor, detail.
# The dashboard's base search and `soc_incidents` both build on this.
[soc_detections]
definition = index=main sourcetype=linux_secure "Failed password" \
| rex "Failed password for (invalid user )?(?<u>\\S+) from (?<src>\\S+)" \
| bin _time span=5m | stats count as n earliest(_time) as et values(src) as src by u _time \
| where n>=5 | eval _time=et, detection="SSH brute force", mitre="T1110.001", tactic="Credential Access", actor=u, detail=n." failed SSH logins from ".mvindex(src,0)." in 5 min" \
| fields _time detection mitre tactic actor detail \
| append [ search index=main sourcetype=linux_secure "new user:" "svc_backup" \
    | eval detection="New local account", mitre="T1136.001", tactic="Persistence", actor="analyst", detail="useradd svc_backup" \
    | fields _time detection mitre tactic actor detail ] \
| append [ search index=main sourcetype=syslog "systemd[1]: Starting" "sysupdate-check.service" \
    | stats min(_time) as et | eval _time=et, detection="Unknown systemd service", mitre="T1543.002", tactic="Persistence", actor="analyst", detail="sysupdate-check.service not in known-good baseline" \
    | fields _time detection mitre tactic actor detail ] \
| append [ search index=main sourcetype=linux_secure "password for " "127.0.0.1" \
    | rex "(?<r>Failed|Accepted) password for (?<acct>\\S+) from (?<src>\\S+)" \
    | eval et=_time | bin _time span=10m \
    | stats count(eval(r=="Failed")) as fb count(eval(r=="Accepted")) as ok values(acct) as acct min(et) as et by src _time \
    | where fb>=3 AND ok>=1 | eval _time=et, detection="Valid-account login after brute force", mitre="T1078", tactic="Defense Evasion", actor=mvindex(acct,0), detail=fb." fails then a success from ".src \
    | fields _time detection mitre tactic actor detail ] \
| append [ search index=main sourcetype=linux_audit (key=cron_persist OR key=cron_exec) type=SYSCALL \
    | stats min(_time) as et values(comm) as comm by AUID | eval _time=et, detection="Cron persistence", mitre="T1053.003", tactic="Persistence", actor=AUID, detail="cron written via ".mvjoin(comm,", ") \
    | fields _time detection mitre tactic actor detail ] \
| append [ search index=main sourcetype=linux_audit key=log_tamper type=SYSCALL comm IN ("truncate","rm","dd","shred","bash") \
    | stats min(_time) as et values(comm) as comm by AUID | eval _time=et, detection="System log cleared", mitre="T1070.002", tactic="Defense Evasion", actor=AUID, detail="truncate / rm on log files via ".mvjoin(comm,", ") \
    | fields _time detection mitre tactic actor detail ] \
| append [ search index=main sourcetype=linux_audit type=EXECVE ("nmap" OR ("ip" AND "neigh")) \
    | eval cmd=mvjoin(mvappend(a0,a1,a2,a3,a4)," ") \
    | search cmd="nmap -sn*" OR cmd="nmap -p*" OR cmd="ip neigh*" \
    | stats min(_time) as et values(cmd) as cmd | eval _time=et, detection="Network scan / discovery", mitre="T1018", tactic="Discovery", actor="analyst", detail=mvcount(cmd)." recon commands (nmap sweep, port scan, ARP)" \
    | fields _time detection mitre tactic actor detail ] \
| append [ search index=main sourcetype=linux_audit key=perm_mod type=SYSCALL \
    | rex "\\ba2=(?<mh>[0-9a-f]+)" | eval mo=tonumber(mh,16) \
    | where floor(mo/2048)%2==1 OR floor(mo/1024)%2==1 \
    | stats min(_time) as et by AUID | eval _time=et, detection="Setuid bit set on binary", mitre="T1548.001", tactic="Privilege Escalation", actor=AUID, detail="chmod set the setuid bit (mode 04755)" \
    | fields _time detection mitre tactic actor detail ] \
| eval sig=detection." [".mitre."]" \
| fields _time sig detection mitre tactic actor detail
iseval = 0

# soc_incidents — collapses soc_detections into per-actor sessions (90-min gap) and
# scores each: risk = 5*detections + 20*distinct_tactics. Severity CRITICAL / HIGH / LOW.
[soc_incidents]
definition = `soc_detections` \
| transaction actor maxpause=90m mvlist=sig \
| eval detections=eventcount, tactics=mvcount(mvdedup(tactic)), techniques=mvcount(mvdedup(mitre)) \
| eval risk_score=(detections*5)+(tactics*20) \
| eval severity=case(tactics>=4 OR risk_score>=90,"CRITICAL", detections>=2,"HIGH", true(),"LOW") \
| eval first_seen=_time, span_min=round(duration/60) \
| table first_seen span_min actor severity risk_score detections tactics techniques sig \
| sort - risk_score
iseval = 0
